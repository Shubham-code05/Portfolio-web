<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none">
  <!-- Pixel-tuned 16×16 variant of the terminal-bot mark: every line sits exactly on the pixel grid. -->
  <rect width="16" height="16" rx="3.5" fill="#0a0d0c"/>
  <!-- antenna: 2×2 green signal dot resting on the head -->
  <rect x="7" y="3" width="2" height="2" fill="#22c55e" shape-rendering="crispEdges"/>
  <!-- head: 1px outline on rows 5 & 13, columns 2 & 13 -->
  <rect x="2.5" y="5.5" width="11" height="8" rx="2" stroke="#e9edeb" stroke-width="1"/>
  <!-- ">" prompt, drawn pixel by pixel -->
  <g fill="#e9edeb" shape-rendering="crispEdges">
    <rect x="5" y="8" width="1" height="1"/>
    <rect x="6" y="9" width="1" height="1"/>
    <rect x="5" y="10" width="1" height="1"/>
  </g>
  <!-- "_" cursor -->
  <rect x="8" y="10" width="3" height="1" fill="#22c55e" shape-rendering="crispEdges"/>
</svg>
